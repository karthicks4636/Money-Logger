{% comment %}
Desktop nav link with consistent active state.
Params: url_name, key (matched against active_page), label, icon
{% endcomment %}
<a href="{% url url_name %}"
   class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition-colors {% if active_page == key %}bg-primary/10 text-primary{% else %}text-muted-foreground hover:bg-accent hover:text-foreground{% endif %}">
    {% include "components/icon.html" with name=icon size=16 %}
    <span>{{ label }}</span>
</a>
