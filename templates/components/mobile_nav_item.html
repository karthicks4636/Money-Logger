{% comment %}Bottom-bar item. Params: url_name, key, label, icon{% endcomment %}
<a href="{% url url_name %}"
   class="flex min-w-[60px] flex-col items-center gap-1 rounded-lg px-3 py-1.5 text-xs font-medium transition-colors {% if active_page == key %}text-primary{% else %}text-muted-foreground hover:text-foreground{% endif %}">
    {% include "components/icon.html" with name=icon size=20 %}
    <span>{{ label }}</span>
</a>
