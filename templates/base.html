{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/png" href="/media/logo/logo.png">
    <title>{% block title %}Money Logger{% endblock %}</title>

    {# No-FOUC theme init: set .dark before first paint #}
    <script>
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    {% block head_extra %}{% endblock %}
</head>
<body class="min-h-full font-sans {% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}

    {# Shared theme toggle handler (used by AppHeader). #}
    <script>
        function toggleTheme() {
            var root = document.documentElement;
            var isDark = root.classList.toggle("dark");
            try { localStorage.setItem("theme", isDark ? "dark" : "light"); } catch (e) {}
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
